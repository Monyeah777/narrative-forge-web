<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>B1-3 Path B — one-shot getImageData sampler</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050505;
        --fg: #e8e8e8;
        --muted: #8a8a8a;
        --line: #2a2a2a;
        --steel: #6f8faf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-monospace, Menlo, monospace;
        padding: 24px;
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        max-width: 52rem;
        margin: 0 0 16px;
      }
      button {
        appearance: none;
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--steel);
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible {
        outline: 2px solid var(--steel);
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #status {
        margin-left: 12px;
        color: var(--steel);
      }
      pre {
        margin-top: 20px;
        padding: 12px;
        border: 1px solid var(--line);
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>B1-3 · Path B（浏览器一次性提取）</h1>
    <p>
      <code>getContext('2d', { willReadFrequently: true })</code> → 加载
      <code>01-dallas.jpg</code> → <strong>一次</strong>
      <code>getImageData</code> → 采样 → 契约 v2 JSON。禁止每帧/交互回调里再采。
      页面 fetch 接到原型是 B1-4。
    </p>
    <p>
      <button type="button" id="run">RUN ONCE</button>
      <span id="status">idle</span>
    </p>
    <pre id="out">{}</pre>
    <pre id="log"></pre>
    <script src="./sample-browser.js"></script>
  </body>
</html>

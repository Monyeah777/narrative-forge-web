<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NF · 立体动态粒子（独立演示）</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 16px; bottom: 14px; z-index: 2;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: rgba(232,230,226,.78); letter-spacing: .06em; pointer-events: none; }
  .hud b { font-weight: 500; color: rgba(255,255,255,.92); }
  .hint { position: fixed; right: 16px; bottom: 14px; z-index: 2;
    font: 11px/1.6 ui-monospace, Menlo, monospace; color: rgba(232,230,226,.5); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">NF 立体粒子 · <b id="n">–</b> 粒 · <b id="fps">–</b> fps · 单次 draw call（0 CPU/帧）</div>
<div class="hint">拖动旋转 · 滚轮缩放 · 空格暂停 &nbsp;·&nbsp; 引擎：<b>nf-particles3d.js</b>（与现网「3D」键同一份）</div>
<script src="nf-particles3d.js"></script>
<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(location.search);
  var qsN = parseInt(qs.get("n") || "", 10);
  var count = qsN >= 1000 && qsN <= 400000 ? qsN : 120000;
  var canvas = document.getElementById("c");
  /* 独立演示页 = 抽象模式（涡旋/curl）；现网「3D」键走浮雕模式（把平面画作立体化） */
  var h = window.NF3D.mount(canvas, { count: count, captureWheel: true, mode: "abstract" });
  document.getElementById("n").textContent = h.n.toLocaleString("en-US");
  window.__nfParticles3D = h;
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") {
      e.preventDefault();
      var s = h.state();
      h.setPaused(!s.paused);
    }
  });
  setInterval(function () {
    var s = h.state();
    document.getElementById("fps").textContent = s.fps.toFixed(0);
  }, 500);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050505" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>§5 · 真机试炼</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      background: #050505;
      color: #e8eef6;
      font: 13px/1.5 ui-monospace, "Courier New", monospace;
    }
    main { padding: 20px 22px 28px; }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
    p { color: #8a8a8a; max-width: 52rem; margin: 0 0 14px; }
    button {
      appearance: none;
      background: transparent;
      color: #e8eef6;
      border: 1px solid #6F8FAF;
      padding: 8px 14px;
      font: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:focus-visible { outline: 2px solid #6F8FAF; outline-offset: 3px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #status { margin-left: 12px; color: #6F8FAF; }
    iframe {
      width: min(960px, 100%);
      height: 540px;
      border: 1px solid #2a2a2a;
      background: #050505;
      display: block;
      margin: 16px 0;
    }
    pre {
      margin: 0;
      padding: 12px;
      border: 1px solid #2a2a2a;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .pass { color: #8faf6f; }
    .fail { color: #A33B2A; }
  </style>
</head>
<body>
  <main>
    <h1>§5 · 真机试炼（bench.html 协议）</h1>
    <p>
      U10：long task / 帧时间 1% low / 成画停帧。
      U11：32×32 相关系数 + 亮度直方图（node 一次 readback）。
      打断演练 ×20：START / 首页 / SAVE。
      不改视觉档，不开轨道 B。
    </p>
    <p>
      <button type="button" id="run">RUN</button>
      <span id="status">idle</span>
    </p>
    <iframe id="stage" title="原型" src="index.html?dpr=1"></iframe>
    <pre id="out">{}</pre>
  </main>
  <script>
    (function () {
      "use strict";
      var runBtn = document.getElementById("run");
      var statusEl = document.getElementById("status");
      var outEl = document.getElementById("out");
      var frame = document.getElementById("stage");

      function sleep(ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      }

      function win() {
        return frame.contentWindow;
      }

      function leavePointer() {
        var w = win();
        var el = w && w.document.getElementById("void");
        if (el) el.dispatchEvent(new PointerEvent("pointerleave", { bubbles: true }));
        if (w && w.document) w.document.dispatchEvent(new PointerEvent("pointerleave", { bubbles: true }));
      }

      function waitReady(timeoutMs) {
        var deadline = Date.now() + timeoutMs;
        return new Promise(function (resolve, reject) {
          (function poll() {
            var w = win();
            var info = w && w.__nfRender;
            if (info && info.n > 0 && info.atlasIsImageBitmap) {
              resolve(info);
              return;
            }
            if (Date.now() > deadline) {
              reject(new Error("atlas not ready"));
              return;
            }
            setTimeout(poll, 50);
          })();
        });
      }

      function waitPainted(timeoutMs) {
        var deadline = Date.now() + timeoutMs;
        return new Promise(function (resolve) {
          (function poll() {
            var info = win().__nfRender;
            if (info && (info.workerHasFrame || info.workerBlit === false)) {
              resolve(info);
              return;
            }
            if (Date.now() > deadline) {
              resolve(info);
              return;
            }
            setTimeout(poll, 40);
          })();
        });
      }

      async function run() {
        runBtn.disabled = true;
        statusEl.className = "";
        statusEl.textContent = "warming";
        var report = { task: "S5", gates: {} };
        try {
          await waitReady(20000);
          await waitPainted(4000);
          await sleep(200);
          var w = win();
          if (w.__nfResetPerf) w.__nfResetPerf();
          statusEl.textContent = "chaos 2s";
          await sleep(2000);
          report.chaos = {
            n: w.__nfRender.n,
            running: w.__nfRender.running,
            mode: w.__nfRender.mode,
            dpr: w.__nfRender.dpr,
            spring: w.__nfAnim && w.__nfAnim.spring,
            damp: w.__nfAnim && w.__nfAnim.damp,
            perf: JSON.parse(JSON.stringify((w.__nfGetPerf && w.__nfGetPerf()) || {}))
          };
          statusEl.textContent = "visibility";
          var chaosRunning = w.__nfRender.running;
          Object.defineProperty(w.document, "hidden", { configurable: true, get: function () { return true; } });
          w.document.dispatchEvent(new Event("visibilitychange"));
          var hiddenRunning = w.__nfRender.running;
          Object.defineProperty(w.document, "hidden", { configurable: true, get: function () { return false; } });
          w.document.dispatchEvent(new Event("visibilitychange"));
          report.visibility = {
            wasRunning: chaosRunning,
            hiddenRunning: hiddenRunning,
            paused: chaosRunning === true && hiddenRunning === false
          };
          await sleep(200);
          if (w.__nfResetPerf) w.__nfResetPerf();
          statusEl.textContent = "assemble";
          var t0 = performance.now();
          w.document.getElementById("btn-intro").click();
          leavePointer();
          var formed = null;
          var deadline = Date.now() + 5000;
          while (Date.now() < deadline) {
            formed = {
              mode: w.__nfRender.mode,
              running: w.__nfRender.running,
              activeCount: w.__nfRender.activeCount,
              tickCount: w.__nfRender.tickCount
            };
            if (formed.mode === "formed" && formed.running === false) break;
            await sleep(40);
          }
          report.assemble_ms = Math.round(performance.now() - t0);
          leavePointer();
          await sleep(400);
          var afterIdle = {
            running: w.__nfRender.running,
            tickCount: w.__nfRender.tickCount,
            mode: w.__nfRender.mode
          };
          report.stop_frame = {
            ticks_before: formed && formed.tickCount,
            ticks_after: afterIdle.tickCount,
            held: afterIdle.tickCount === (formed && formed.tickCount) && afterIdle.running === false
          };
          report.formed = formed;

          statusEl.textContent = "interrupt ×20";
          var nan0 = w.__nfAnim ? w.__nfAnim.nanHeals : 0;
          var i;
          for (i = 0; i < 20; i++) {
            w.document.getElementById("btn-start").click();
            w.document.getElementById("btn-home").click();
            w.document.getElementById("btn-save").click();
          }
          if (w.__nfRender.frozen) w.document.getElementById("btn-save").click();
          leavePointer();
          report.interrupt = {
            cycles: 20,
            nan0: nan0,
            nanHeals: w.__nfAnim ? w.__nfAnim.nanHeals : -1,
            n: w.__nfRender.n,
            alive: w.__nfRender.n === 12000
          };

          var workP95 = report.chaos.perf.work ? report.chaos.perf.work.p95 : 99;
          var workLow = report.chaos.perf.workPct1Low ? report.chaos.perf.workPct1Low.meanMs : 99;
          var lt = report.chaos.perf.longtaskCount;
          report.gates = {
            n_12000: report.chaos.n === 12000,
            work_p95_le_16_67: workP95 <= 16.67,
            work_1pct_low_le_16_67: workLow <= 16.67,
            chaos_longtask_0: lt === 0,
            formed_idle: report.formed && report.formed.mode === "formed" && report.formed.running === false,
            stop_frame: report.stop_frame.held === true,
            interrupt_20_no_nan: report.interrupt.nanHeals === report.interrupt.nan0 && report.interrupt.alive,
            visibility_pauses: report.visibility.paused === true
          };
          window.__nfBench = report;
          outEl.textContent = JSON.stringify(report, null, 2);
          var pass = Object.keys(report.gates).every(function (k) { return report.gates[k]; });
          statusEl.className = pass ? "pass" : "fail";
          statusEl.textContent = pass ? "PASS (U11 32×32 in node harness)" : "FAIL";
        } catch (err) {
          statusEl.className = "fail";
          statusEl.textContent = String(err && err.message ? err.message : err);
          outEl.textContent = String(err && err.stack ? err.stack : err);
        }
        runBtn.disabled = false;
      }

      runBtn.addEventListener("click", function () { run(); });
      if (/[?&]auto=1/.test(location.search)) {
        frame.addEventListener("load", function () { run(); }, { once: true });
      }
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050505" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NF · Pixi H1-10 density 100k / 150k / 250k</title>
  <style>
    html, body {
      margin: 0;
      background: #050505;
      color: #e8eef6;
      font: 13px/1.5 ui-monospace, "Courier New", monospace;
    }
    main { padding: 12px 16px 16px; }
    #host canvas { display: block; border: 1px solid #2a2a2a; }
    #log { margin-top: 10px; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; }
    .fail { color: #A33B2A; }
    .pass { color: #8faf6f; }
  </style>
</head>
<body>
  <main>
    <p>H1-10 点数档对照 · isolated ParticleContainer · 现网仍 100k · 定档等作者 PC+手机双端 60fps</p>
    <div id="host"></div>
    <pre id="log">booting</pre>
  </main>
  <script src="../vendor/pixi.min.js"></script>
  <script src="../pixi-bridge/points-bin.js"></script>
  <script>
    (function () {
      "use strict";
      var logEl = document.getElementById("log");
      var host = document.getElementById("host");
      var errors = [];
      var ASSETS = {
        "100000": { bin: "../pixi-cloud/dallas-100k.bin", meta: "../pixi-cloud/meta.json" },
        "150000": { bin: "dallas-150k.bin", meta: "meta-150k.json" },
        "250000": { bin: "dallas-250k.bin", meta: "meta-250k.json" }
      };
      window.addEventListener("error", function (e) {
        errors.push(String(e.message || e.error || e));
      });
      window.addEventListener("unhandledrejection", function (e) {
        errors.push(String(e.reason || e));
      });

      function fail(msg) {
        logEl.className = "fail";
        logEl.textContent = msg;
        window.__nfPixiDensity = { ok: false, error: msg, errors: errors.slice() };
      }

      function parseHex(hex) {
        return parseInt(String(hex).replace("#", ""), 16);
      }

      function wantedCount() {
        var raw = new URLSearchParams(location.search).get("n");
        var n = raw == null || raw === "" ? 100000 : Number(raw);
        return n;
      }

      /* I-2: 128×128 soft dot, scale down. Official Texture.from(source). */
      function makeSoftDot(size) {
        var c = document.createElement("canvas");
        c.width = size;
        c.height = size;
        var ctx = c.getContext("2d");
        var mid = size * 0.5;
        var g = ctx.createRadialGradient(mid, mid, 0, mid, mid, mid);
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.35, "rgba(255,255,255,0.85)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, size, size);
        return PIXI.Texture.from(c);
      }

      (async function () {
        if (!window.PIXI || typeof PIXI.Application !== "function") {
          fail("PIXI.Application missing");
          return;
        }
        if (!PIXI.ParticleContainer || !PIXI.Particle || !PIXI.Rectangle) {
          fail("ParticleContainer / Particle / Rectangle missing");
          return;
        }
        if (!window.NFPointsBin) {
          fail("NFPointsBin missing");
          return;
        }

        var n = wantedCount();
        var asset = ASSETS[String(n)];
        if (!asset) {
          fail("n must be 100000 | 150000 | 250000, got " + n);
          return;
        }

        var metaRes = await fetch(asset.meta);
        var binRes = await fetch(asset.bin);
        if (!metaRes.ok || !binRes.ok) {
          fail("fetch failed " + asset.bin + " / " + asset.meta);
          return;
        }
        var meta = await metaRes.json();
        var buffer = await binRes.arrayBuffer();
        if (meta.count !== n) {
          fail("meta.count " + meta.count + " !== n " + n);
          return;
        }
        var pts = NFPointsBin.readPointsBin(buffer, meta.count);
        if (pts.length !== n) {
          fail("count " + pts.length + " !== " + n);
          return;
        }

        var viewW = 640;
        var viewH = Math.round(viewW * meta.h / meta.w);
        var app = new PIXI.Application();
        await app.init({
          width: viewW,
          height: viewH,
          backgroundColor: 0x050505,
          preference: "webgl",
          antialias: false,
          autoStart: true,
          resolution: 1,
          autoDensity: true
        });
        host.appendChild(app.canvas);

        var texture = makeSoftDot(128);
        var container = new PIXI.ParticleContainer({
          texture: texture,
          dynamicProperties: { position: true, color: false }
        });
        container.boundsArea = new PIXI.Rectangle(0, 0, viewW, viewH);

        var margin = 8;
        var innerW = viewW - margin * 2;
        var innerH = viewH - margin * 2;
        var scale = 3 / 128;
        var i;
        var nx;
        var ny;
        for (i = 0; i < pts.length; i++) {
          nx = pts[i].x / 65535;
          ny = pts[i].y / 65535;
          container.addParticle(new PIXI.Particle({
            texture: texture,
            x: margin + nx * innerW,
            y: margin + ny * innerH,
            tint: parseHex(meta.palette[pts[i].idx]),
            alpha: 1,
            anchorX: 0.5,
            anchorY: 0.5,
            scaleX: scale,
            scaleY: scale
          }));
        }
        /* Color is static — official: call update() after static writes. */
        container.update();
        app.stage.addChild(container);

        var ticks = 0;
        var info = {
          ok: errors.length === 0,
          version: PIXI.VERSION || "",
          rendererName: app.renderer && app.renderer.name ? String(app.renderer.name) : "",
          count: container.particleChildren ? container.particleChildren.length : pts.length,
          n: n,
          stageChildren: app.stage.children.length,
          usedAddParticle: true,
          usedSprite: false,
          softDot: 128,
          view: { w: viewW, h: viewH },
          sha256: meta.sha256,
          bin: asset.bin,
          ticks: 0,
          fps: 0,
          tickerStarted: !!(app.ticker && app.ticker.started),
          errors: errors.slice()
        };
        app.ticker.add(function () {
          ticks += 1;
          info.ticks = ticks;
          info.fps = app.ticker.FPS;
          info.ok = errors.length === 0 && info.count === n;
          window.__nfPixiDensity = info;
        });
        window.__nfPixiDensity = info;
        logEl.className = info.ok ? "pass" : "fail";
        logEl.textContent = JSON.stringify({
          ok: info.ok,
          n: info.n,
          version: info.version,
          rendererName: info.rendererName,
          count: info.count,
          view: info.view,
          sha256: info.sha256
        }, null, 2);
      })().catch(function (err) {
        fail(String(err && err.stack ? err.stack : err));
      });
    })();
  </script>
</body>
</html>
